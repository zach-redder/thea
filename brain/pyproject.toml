[project]
name = "brain"
version = "0.1.0"
requires-python = ">=3.11"
description = "PostgreSQL + pgvector data layer for thea — schema, migrations, and the direct-access repository layer used by heart."
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
