[project]
name = "thea-db"
version = "0.1.0"
description = "THEA's data layer: Postgres + pgvector schema, generated models, repositories and the Redis session store."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.2",
]

[project.optional-dependencies]
# Only needed to regenerate migrations/models/seed from THEA DB.xlsx.
schema = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thea_db"]
