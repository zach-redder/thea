# Dev overrides, auto-merged by `docker compose up`: bind-mount source and hot-reload.
services:
  agent:
    volumes:
      - ./services/agent/src:/repo/services/agent/src
      - ./packages:/repo/packages
    command: ["uvicorn", "thea_agent.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  home:
    volumes:
      - ./services/home/src:/repo/services/home/src
      - ./packages/thea-contracts:/repo/packages/thea-contracts
    command: ["uvicorn", "thea_home.main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]
