repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # The schema source and seed hold real personal data. Block them outright.
      - id: block-personal-data
        name: block personal data files
        entry: personal data (*.xlsx / local_seed.sql) must never be committed
        language: fail
        files: (\.xlsx$|local_seed\.sql$)
