[project]
name = "thea-home"
version = "0.1.0"
description = "THEA's smart-home actuation: Home Assistant and MQTT device control. Executes commands from the agent; makes no decisions."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "thea-contracts",
]

[project.scripts]
thea-home = "thea_home.main:run"

[tool.uv.sources]
thea-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thea_home"]
