[project]
name = "heart"
version = "0.1.0"
requires-python = ">=3.11"
description = "Core orchestration for thea — context assembly, Claude API calls, tool routing, memory extraction."
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
  "apscheduler>=3.10",
  "voyageai>=0.3",
  "python-dotenv>=1.0",
  "brain",
]

[tool.uv]
package = false

[tool.uv.sources]
brain = { workspace = true }
