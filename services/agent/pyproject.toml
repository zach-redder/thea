[project]
name = "thea-agent"
version = "0.1.0"
description = "THEA's agent runtime and API gateway: context assembly, Claude, tools, memory, scheduler, and the HTTP/WebSocket API every client uses."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "anthropic>=0.40",
  "mcp>=1.2",
  "voyageai>=0.3",
  "apscheduler>=3.11",
  "thea-db",
  "thea-contracts",
]

[project.scripts]
thea-agent = "thea_agent.main:run"

[tool.uv.sources]
thea-db = { workspace = true }
thea-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thea_agent"]
