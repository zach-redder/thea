[project]
name = "thea-voice"
version = "0.1.0"
description = "THEA's voice I/O: wake word, VAD, speech-to-text, speaker detection, text-to-speech and room routing."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "thea-contracts",
]

[project.optional-dependencies]
# Heavy, hardware/model-dependent stack. Opt in with `uv sync --extra models`
# once the pipeline is implemented; versions get tightened at that point.
models = [
  "pvporcupine>=3.0",
  "silero-vad>=5.1",
  "faster-whisper>=1.1",
  "elevenlabs>=1.50",
  "sounddevice>=0.5",
]
diarization = ["pyannote.audio>=3.3"]

[project.scripts]
thea-voice = "thea_voice.main:run"

[tool.uv.sources]
thea-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thea_voice"]
