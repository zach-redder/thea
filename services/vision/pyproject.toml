[project]
name = "thea-vision"
version = "0.1.0"
description = "THEA's vision: a cheap always-on motion/person gate that escalates to scene analysis only when flagged."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "thea-contracts",
]

[project.optional-dependencies]
models = ["opencv-python-headless>=4.10", "ultralytics>=8.3"]

[project.scripts]
thea-vision = "thea_vision.main:run"

[tool.uv.sources]
thea-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thea_vision"]
