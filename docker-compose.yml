# Local stack. `docker compose up` starts the core (db, cache, migrate, agent,
# home, web). Voice and vision need audio/camera hardware, so they're opt-in:
#   docker compose --profile perception up
# Secrets come from the root .env (copy .env.example).

x-python-service: &python-service
  env_file:
    - path: .env
      required: false
  environment:
    TZ: UTC
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thea
      POSTGRES_PASSWORD: thea
      POSTGRES_DB: thea
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ./packages/thea-db
      dockerfile: ../../infra/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://thea:thea@postgres:5432/thea
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    <<: *python-service
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://thea:thea@postgres:5432/thea
      REDIS_URL: redis://redis:6379/0
      VOICE_SERVICE_URL: http://voice:8010
      HOME_SERVICE_URL: http://home:8030
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  home:
    <<: *python-service
    build:
      context: .
      dockerfile: services/home/Dockerfile
    ports:
      - "8030:8030"
    environment:
      TZ: UTC
      AGENT_URL: http://agent:8000

  voice:
    <<: *python-service
    profiles: ["perception"]
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    ports:
      - "8010:8010"
    environment:
      TZ: UTC
      AGENT_URL: http://agent:8000
    volumes:
      - ./services/voice/models:/repo/services/voice/models:ro
    # Linux hosts: pass the mic/speaker through, e.g.
    # devices: ["/dev/snd:/dev/snd"]

  vision:
    <<: *python-service
    profiles: ["perception"]
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    ports:
      - "8020:8020"
    environment:
      TZ: UTC
      AGENT_URL: http://agent:8000
    volumes:
      - ./services/vision/models:/repo/services/vision/models:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_THEA_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
